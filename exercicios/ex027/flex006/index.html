<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Centralização</title>
    <style>
        * {
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }

        body {
            background-color: lightsalmon;
        }

        main {
            background-color: lightgreen;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-flow: row nowrap;
            justify-content: center;
            align-items: center;
        }

        section {
            background-color: lightseagreen;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Align-content</h1>
        <p>Esse modelo vai alinhar os itens dentro do eixo transversal, quando esses estão empacotados.</p>
        <p>Dessa vez trabalharemos com o <code>flex-flow: row wrap;</code></p>
    </header>
    <main>
        <section id="stretch">
            <h1>Tela de Login</h1>
        </section> <br>
    </main>
</body>
</html>
